<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">西湖地形可视化图</title>
  <desc id="desc">基于西湖公开地理位置手工矢量化的地形可视化，包含水体、山体、堤岸、岛屿、游线和导览点位。</desc>
  <defs>
    <linearGradient id="land" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#1f372b"/><stop offset="0.42" stop-color="#233b2b"/><stop offset="1" stop-color="#071620"/></linearGradient>
    <radialGradient id="lake" cx="54%" cy="47%" r="44%"><stop offset="0" stop-color="#68d8cd" stop-opacity="0.82"/><stop offset="0.52" stop-color="#277f8a" stop-opacity="0.78"/><stop offset="1" stop-color="#0b3e61" stop-opacity="0.92"/></radialGradient>
    <radialGradient id="hill" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#d5c279" stop-opacity="0.72"/><stop offset="0.52" stop-color="#557d4b" stop-opacity="0.5"/><stop offset="1" stop-color="#16352b" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="labelShadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#031016" flood-opacity="0.65"/></filter>
  </defs>
  <rect width="1600" height="980" fill="url(#land)"/>
  <ellipse cx="326" cy="444" rx="360" ry="470" fill="url(#hill)" filter="url(#soft)" opacity="0.95" transform="rotate(-11 326 444)"/>
  <ellipse cx="1160" cy="830" rx="420" ry="135" fill="#b6a65f" opacity="0.22" filter="url(#soft)" transform="rotate(5 1160 830)"/>
  <ellipse cx="735" cy="458" rx="492" ry="330" fill="url(#lake)" transform="rotate(-5 735 458)"/>
  <ellipse cx="723" cy="456" rx="540" ry="366" fill="none" stroke="#d7d1a4" stroke-opacity="0.24" stroke-width="9" transform="rotate(-5 723 456)"/>
  <g opacity="0.24" fill="none" stroke="#f3e7ad" stroke-linecap="round">
    <path d="M118 370 C210 250 350 160 510 166" stroke-width="7"/>
    <path d="M96 482 C236 386 382 330 548 348" stroke-width="5"/>
    <path d="M148 630 C298 556 426 520 578 548" stroke-width="4"/>
    <path d="M186 742 C316 696 430 674 556 702" stroke-width="3"/>
