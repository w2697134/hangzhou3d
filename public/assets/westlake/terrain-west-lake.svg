    <circle cx="34" cy="34" r="10" fill="#68d8cd"/><text x="58" y="42" font-size="20">湖面与岛屿</text>
    <circle cx="34" cy="72" r="10" fill="#d7c176"/><text x="58" y="80" font-size="20">白堤、苏堤、游步道</text>
    <path d="M24 108 L46 108" stroke="#70fff0" stroke-width="6" stroke-linecap="round"/><text x="58" y="116" font-size="20">导览动线</text>
