    <path d="M784 178 C700 206 628 232 558 270" stroke="#d7c176" stroke-width="12" stroke-linecap="round" fill="none"/>
    <ellipse cx="782" cy="568" rx="83" ry="52" transform="rotate(-12 782 568)"/>
    <ellipse cx="934" cy="486" rx="58" ry="34" transform="rotate(16 934 486)"/>
  </g>
  <g fill="none" stroke="#70fff0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.72">
    <path d="M888 162 L774 206 L710 282 L646 376 L638 526 L650 700 L782 568 L914 468 L1012 280 L1128 224"/>
  </g>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif" filter="url(#labelShadow)">
    <g fill="#061116" stroke="#e9f9ed" stroke-width="2">
      <circle cx="888" cy="162" r="12"/><circle cx="774" cy="206" r="12"/><circle cx="710" cy="282" r="12"/><circle cx="646" cy="376" r="12"/><circle cx="638" cy="526" r="12"/><circle cx="650" cy="700" r="12"/><circle cx="782" cy="568" r="12"/><circle cx="914" cy="468" r="12"/><circle cx="1012" cy="280" r="12"/><circle cx="1128" cy="224" r="12"/>
    </g>
    <g fill="#f5fff8" font-size="28" font-weight="700">
      <text x="912" y="154">断桥</text><text x="792" y="198">白堤</text><text x="728" y="274">平湖秋月</text><text x="420" y="376">曲院风荷</text><text x="514" y="526">苏堤</text><text x="514" y="724">花港</text><text x="804" y="560">三潭印月</text><text x="936" y="462">雷峰塔</text><text x="1034" y="274">南屏</text><text x="1152" y="218">柳浪闻莺</text>
